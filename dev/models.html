<!doctype html>
<html><head><meta charset="utf-8"><title>Models</title>
<style>body{margin:0;background:#b9c7f0;font:11px sans-serif}#g{display:flex;flex-wrap:wrap;gap:4px;padding:6px}.c{width:150px;text-align:center}.c canvas{width:150px;height:150px;background:#cfdaf7;border-radius:8px}</style>
</head><body><div id="g"></div>
<script type="module">
// ?list=hex/blue/building_tower_A_blue,td/tile ... renders each model isometrically.
import * as THREE from 'three';
import { loadModel, instance } from '../src/render3d/assets';
const q = new URLSearchParams(location.search);
const list = (q.get('list') ?? '').split(',').filter(Boolean);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setSize(300, 300);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
for (const name of list) {
  const div = document.createElement('div'); div.className = 'c';
  const cv = document.createElement('canvas'); cv.width = cv.height = 300;
  div.append(cv, name.split('/').pop()); document.getElementById('g').append(div);
  try {
    await loadModel(name + '.glb');
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight('#dfe9ff', '#6b5a48', 1.6));
    const sun = new THREE.DirectionalLight('#fff4dc', 2.6); sun.position.set(-4, 10, 6); scene.add(sun);
    const o = instance(name + '.glb'); scene.add(o);
    const box = new THREE.Box3().setFromObject(o); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
    const r = Math.max(size.x, size.y, size.z) * 0.75 + 0.1;
    const cam = new THREE.OrthographicCamera(-r, r, r, -r, 0.01, 100);
    cam.position.set(c.x + 10, c.y + 10, c.z + 10); cam.lookAt(c);
    renderer.render(scene, cam);
    cv.getContext('2d').drawImage(renderer.domElement, 0, 0);
  } catch (e) { div.append(' ERR'); console.error(name, e); }
}
document.title = 'done';
</script></body></html>

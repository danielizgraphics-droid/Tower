<!doctype html>
<html><head><meta charset="utf-8"><title>Gallery</title>
<style>body{margin:0;background:#a9b6ea;font:12px sans-serif} .row{display:flex;gap:2px;align-items:end;padding:2px 8px} .row b{width:110px} img{width:110px;height:110px;background:rgba(255,255,255,.25);border-radius:8px} .e{flex-wrap:wrap} .e img{width:90px;height:90px}</style>
</head><body><div id="g"></div>
<script type="module">
import { TOWER_LIST } from '../src/data/towers';
import { ENEMY_LIST } from '../src/data/enemies';
import { towerPortrait, enemyPortrait } from '../src/render/portraits';
const g = document.getElementById('g');
for (const t of TOWER_LIST) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<b>${t.id}</b>`;
  const variants = [[1,-1],[2,-1],[3,-1],[4,0],[5,0],[4,1],[5,1],[4,2],[5,2]];
  for (const [tier, br] of variants) { const im = new Image(); im.src = towerPortrait(t.id, tier, br, 110); row.appendChild(im); }
  g.appendChild(row);
}
const er = document.createElement('div'); er.className = 'row e';
for (const e of ENEMY_LIST) { const im = new Image(); im.src = enemyPortrait(e.id, 90); im.title = e.id; er.appendChild(im); }
g.appendChild(er);
</script></body></html>
